name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (Astro + content frontmatter)
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Dependency audit (production, high+)
        run: npm run audit:prod
      - run: npx playwright install --with-deps chromium
      - name: Responsive and accessibility tests (builds the site)
        run: npm run test:e2e
      - name: Internal link check
        run: npm run test:links
      - name: Worker config (dry-run deploy)
        run: npm run deploy:dry-run
      - name: Lighthouse (performance, accessibility, best practices, SEO)
        run: npm run test:lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report/
            lhci-report/
