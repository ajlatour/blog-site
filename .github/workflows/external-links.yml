name: External links

# External sites go down and rate-limit, so this is kept out of the PR checks.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:links:external
